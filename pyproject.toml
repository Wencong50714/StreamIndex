[build-system]
requires = ["setuptools>=82.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "streamindex"
version = "0.1.0"
description = "Streaming video inference engine and benchmark adapters for StreamIndex."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
  "accelerate==1.13.0",
  "aiohttp==3.13.3",
  "anthropic==0.84.0",
  "apache-tvm-ffi==0.1.9",
  "av==17.0.0; sys_platform == 'linux'",
  "blobfile==3.0.0",
  "build==1.4.0",
  "compressed-tensors==0.14.0",
  "cuda-python==12.9.0",
  "datasets==4.6.1",
  "decord2==3.0.0",
  "einops==0.8.2",
  "fastapi==0.135.1",
  "ffmpeg==1.4",
  "flashinfer-cubin==0.6.3",
  "flashinfer-python==0.6.3",
  "gguf==0.18.0",
  "grpcio==1.78.0",
  "grpcio-health-checking==1.78.0",
  "grpcio-reflection==1.78.0",
  "hf-transfer==0.1.9",
  "huggingface-hub==0.36.2",
  "imageio==2.37.3",
  "interegular==0.3.3",
  "ipython==9.11.0",
  "llguidance>=0.7.11,<0.8.0",
  "loguru==0.7.3",
  "modelscope==1.34.0",
  "msgspec==0.20.0",
  "ninja==1.13.0",
  "numpy==2.4.2",
  "nvidia-cutlass-dsl==4.3.5",
  "nvidia-ml-py==13.590.48",
  "openai==2.6.1",
  "openai-harmony==0.0.4",
  "opencv-python-headless==4.13.0.92",
  "orjson==3.11.7",
  "outlines==0.1.11",
  "packaging==26.0",
  "pandas==3.0.1",
  "partial-json-parser==0.2.1.1.post7",
  "pillow==12.1.1",
  "prometheus-client==0.24.1",
  "psutil==7.2.2",
  "py-spy==0.4.1",
  "pybase64==1.4.3",
  "pydantic==2.12.5",
  "python-multipart==0.0.22",
  "pyyaml==6.0.3",
  "pyzmq==27.1.0",
  "qwen-vl-utils==0.0.14",
  "quack-kernels==0.2.4",
  "requests==2.32.5",
  "scipy==1.17.1",
  "sentencepiece==0.2.1",
  "setproctitle==1.3.7",
  "sgl-kernel==0.3.21",
  "smg-grpc-proto==0.4.2",
  "soundfile==0.13.1",
  "tabulate==0.10.0",
  "tiktoken==0.12.0",
  "timm==1.0.16",
  "torch==2.9.1",
  "torch-memory-saver==0.0.9",
  "torchao==0.9.0",
  "torchaudio==2.9.1",
  "torchcodec==0.8.0",
  "torchvision==0.24.1",
  "tqdm==4.67.3",
  "transformers==4.57.1",
  "uvicorn==0.41.0",
  "uvloop==0.22.1",
  "xgrammar==0.1.27",
]

[project.optional-dependencies]
bench = [
  "moviepy==1.0.3",
]
cuda-kernels = [
  "flash-attn==2.8.3",
]
dev = [
  "jsonschema==4.26.0",
]

[project.scripts]
stream-infer = "stream_infer:main"

[tool.setuptools]
package-dir = { "" = "sglang/python" }
py-modules = ["stream_infer"]
include-package-data = true

[tool.setuptools.packages.find]
where = ["sglang/python"]
include = ["sglang*"]
exclude = ["sglang.test*", "sglang.docs*"]

[tool.setuptools.package-data]
"sglang" = [
  "srt/**/*",
  "jit_kernel/**/*",
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[[tool.uv.index]]
name = "torch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pypi", marker = "platform_machine == 'x86_64'" },
  { index = "torch-cu129", marker = "platform_machine == 'aarch64'" },
]
